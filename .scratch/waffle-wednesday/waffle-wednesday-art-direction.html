n style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #b3a9d9;\">served<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex: 1; padding: 9px 4px; border: 2px solid #ff5d73; border-radius: 6px; background: rgba(255,93,115,0.16);\">\n                  <b style=\"display: block; font-family: 'Press Start 2P', monospace; font-size: 15px; color: #ff5d73;\">3<\u002Fb>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #b3a9d9;\">walked<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px; width: 100%; margin-top: 2px;\">\n                <button type=\"button\" style=\"flex: 1; font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.5; padding: 12px 4px; color: #0f0c1e; background: #ffd34d; border: 3px solid #0f0c1e; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; cursor: pointer;\">New shift<\u002Fbutton>\n                <button type=\"button\" style=\"flex: 1; font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.5; padding: 12px 4px; color: #f3efff; background: #2b2350; border: 3px solid #0f0c1e; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; cursor: pointer;\">← Attic<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; line-height: 1.6;\">The only card that changes the panel border and the overlay tint (warm-black → #1c040e). Three lit strike lights replace the emoji.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ======================= 06 SPRITE STUDY ======================= -->\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n        <div style=\"font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff5d73; letter-spacing: 1px;\">06<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #f3efff; letter-spacing: 2px; text-transform: uppercase;\">Icon &amp; sprite study — 12×12 indexed<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 34px; padding: 32px; border: 2px solid #4a3f7a; border-radius: 8px; background: #211a3d; box-shadow: 3px 3px 0 #0f0c1e;\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">WAFFLE DONENESS FRAMES — 3 COLOURS EACH<\u002Fdiv>\n          <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9; max-width: 78ch;\">One 12×12 pixel map, four palettes. Pockets sit at columns 2–3 / 5–6 / 8–9 and the same rows, leaving a 1px rim. Recolour only — never redraw the shape between frames, or the waffle appears to wobble as it toasts.<\u002Fdiv>\n          <div style=\"display: flex; gap: 18px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ waffles }}\" as=\"w\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px; align-items: center; width: 132px;\">\n                <div style=\"position: relative; width: 120px; height: 120px; box-shadow: 3px 3px 0 #0f0c1e;\">\n                  <img src=\"{{ w.url }}\" alt=\"{{ w.label }}\" style=\"width: 120px; height: 120px; display: block; image-rendering: pixelated;\">\n                  <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.14) 0 1px, transparent 1px 10px), repeating-linear-gradient(90deg, rgba(255,255,255,0.14) 0 1px, transparent 1px 10px); pointer-events: none;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 10px; color: #f3efff; text-align: center;\">{{ w.label }}<\u002Fdiv>\n                <div style=\"display: flex; gap: 3px;\">\n                  <sc-for list=\"{{ w.palette }}\" as=\"hex\" hint-placeholder-count=\"3\">\n                    <span style=\"width: 16px; height: 16px; border-radius: 3px; border: 1px solid #0f0c1e; background: {{ hex }};\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size: 8px; color: #b3a9d9; text-align: center; line-height: 1.5;\">{{ w.hexes }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">TOPPING ICONS — 4 TO 6 COLOURS<\u002Fdiv>\n          <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9; max-width: 78ch;\">Proportion references for hand-authored replacements of the shelf emoji. Each fits a 12×12 cell with 1px of breathing room, uses one base + one shade + at most two highlights, and reads at 24px. Index 0 is transparent throughout.<\u002Fdiv>\n          <div style=\"display: flex; gap: 16px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"10\">\n              <div style=\"display: flex; flex-direction: column; gap: 7px; align-items: center; width: 108px;\">\n                <div style=\"position: relative; width: 96px; height: 96px; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 6px; box-shadow: 3px 3px 0 #0f0c1e;\">\n                  <img src=\"{{ ic.url }}\" alt=\"{{ ic.label }}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated;\">\n                  <div style=\"position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.1) 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, rgba(255,255,255,0.1) 0 1px, transparent 1px 8px); pointer-events: none;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 3px; align-items: center;\">\n                  <span style=\"font-size: 13px;\">{{ ic.emoji }}<\u002Fspan>\n                  <sc-for list=\"{{ ic.swatches }}\" as=\"hex\" hint-placeholder-count=\"4\">\n                    <span style=\"width: 12px; height: 12px; border-radius: 2px; border: 1px solid #0f0c1e; background: {{ hex }};\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #b3a9d9; text-align: center; line-height: 1.45;\">{{ ic.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">CREW PORTRAIT FRAME — 28×28, 16-ENTRY PALETTE<\u002Fdiv>\n          <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9; max-width: 78ch;\">Real sprites from <span style=\"color:#f3efff;\">crew-sprites.js<\u002Fspan>, shown with the proposed frame: 3px #0f0c1e border, 4px radius, #2b2350 backing, 3px 3px 0 shadow, <span style=\"color:#f3efff;\">image-rendering: pixelated<\u002Fspan> at 64px (2.29×). The strip under each face is that sprite’s actual 16-colour indexed palette — note how each one already lands inside the attic’s warm-purple range, which is why the frames need no tinting.<\u002Fdiv>\n          <div style=\"display: flex; gap: 22px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ crew }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; flex-direction: column; gap: 9px; align-items: center; width: 132px;\">\n                <img src=\"{{ c.url }}\" alt=\"{{ c.name }}\" style=\"width: 96px; height: 96px; image-rendering: pixelated; border: 3px solid #0f0c1e; border-radius: 4px; background: #2b2350; box-shadow: 3px 3px 0 #0f0c1e;\">\n                <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; color: #f3efff;\">{{ c.name }}<\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(8, 12px); gap: 2px;\">\n                  <sc-for list=\"{{ c.palette }}\" as=\"hex\" hint-placeholder-count=\"16\">\n                    <span style=\"width: 12px; height: 12px; background: {{ hex }};\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #b3a9d9; text-align: center; line-height: 1.5;\">{{ c.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 26px; flex-wrap: wrap; padding-top: 6px; border-top: 2px solid #4a3f7a;\">\n          <div style=\"flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 8px; padding-top: 20px;\">\n            <div style=\"font-family: 'Press Start 2P', monospace; font-size: 8px; color: #3ddc97; letter-spacing: 1px;\">AUTHORING RULES<\u002Fdiv>\n            <div style=\"font-size: 11px; line-height: 1.7; color: #b3a9d9;\">Keep every sprite on the same 12×12 grid so the shelf never needs per-icon nudging. Silhouette first, shade second, highlight last. No anti-aliasing, no diagonals shorter than 2px, no outline — the chip border already does that job.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 8px; padding-top: 20px;\">\n            <div style=\"font-family: 'Press Start 2P', monospace; font-size: 8px; color: #6fb3ff; letter-spacing: 1px;\">MIGRATION PATH<\u002Fdiv>\n            <div style=\"font-size: 11px; line-height: 1.7; color: #b3a9d9;\">Ship emoji now, swap to sprites per-topping later: both render into the same chip box at the same optical size, so the shelf grid and the plate placement percentages stay untouched. Emoji stays the fallback when a sprite is missing, exactly as <span style=\"color:#f3efff;\">crewSpriteEl<\u002Fspan> already does for walk-ins.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 8px; padding-top: 20px;\">\n            <div style=\"font-family: 'Press Start 2P', monospace; font-size: 8px; color: #ffd34d; letter-spacing: 1px;\">MOTION POLICY<\u002Fdiv>\n            <div style=\"font-size: 11px; line-height: 1.7; color: #b3a9d9;\">Sprites never animate. Everything that moves in this design — steam, bob, confetti, shudder, verdict flash — is decoration layered over a state that is already readable from colour, position or text. Under <span style=\"color:#f3efff;\">prefers-reduced-motion<\u002Fspan> the panel loses nothing but sparkle.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;meterValue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:52,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Artboard 03&quot;}}\">\nconst WAFFLE_ROWS = [\n  \"333333333333\",\"311111111113\",\"312212212213\",\"312212212213\",\n  \"311111111113\",\"312212212213\",\"312212212213\",\"311111111113\",\n  \"312212212213\",\"312212212213\",\"311111111113\",\"333333333333\",\n];\n\nconst WAFFLE_FRAMES = [\n  { label: \"pale · v27\", palette: [null, \"#f0dfbe\", \"#dcc79c\", \"#c9b389\"] },\n  { label: \"just golden · v41\", palette: [null, \"#e9cb95\", \"#d0ad72\", \"#b08f56\"] },\n  { label: \"golden · v55\", palette: [null, \"#d9a55c\", \"#bd8640\", \"#96632a\"] },\n  { label: \"charcoal · v95\", palette: [null, \"#4a3226\", \"#2b1c14\", \"#16100c\"] },\n];\n\nconst ICONS = [\n  { id: \"strawberry\", emoji: \"🍓\", label: \"strawberries\",\n    palette: [null, \"#ff5d73\", \"#a3182f\", \"#3ddc97\", \"#ffd9df\"],\n    rows: [\"000003300000\",\"000033330000\",\"000333333000\",\"001111111100\",\"011141111110\",\"011111114110\",\"011411111110\",\"021111141120\",\"002111111200\",\"000211112000\",\"000022220000\",\"000002200000\"] },\n  { id: \"banana\", emoji: \"🍌\", label: \"banana\",\n    palette: [null, \"#ffd34d\", \"#d99f22\", \"#6b4a12\"],\n    rows: [\"000000330000\",\"000001120000\",\"000011200000\",\"000112000000\",\"001120000000\",\"011200000000\",\"011200000000\",\"011120000000\",\"001112000000\",\"000111120000\",\"000011111200\",\"000001222200\"] },\n  { id: \"blueberry\", emoji: \"🫐\", label: \"blueberries\",\n    palette: [null, \"#6fb3ff\", \"#2f5fa8\", \"#17122b\", \"#b9d9ff\"],\n    rows: [\"000000000000\",\"000110001100\",\"001111011110\",\"014111141110\",\"011111011110\",\"002211022110\",\"000000000000\",\"000001100000\",\"000111110000\",\"001411110000\",\"001111110000\",\"000221100000\"] },\n  { id: \"chocolate\", emoji: \"🍫\", label: \"chocolate bar\",\n    palette: [null, \"#6b4423\", \"#3d2412\", \"#a06a3a\"],\n    rows: [\"000000000000\",\"000000000000\",\"033333333330\",\"031111111120\",\"031121121120\",\"031111111120\",\"031121121120\",\"031111111120\",\"031121121120\",\"032222222220\",\"000000000000\",\"000000000000\"] },\n  { id: \"nuts\", emoji: \"🥜\", label: \"crushed nuts\",\n    palette: [null, \"#d2a679\", \"#8a5a2b\", \"#f0d6b3\"],\n    rows: [\"000000000000\",\"003300110000\",\"031130112000\",\"011120022000\",\"002200000000\",\"000001133000\",\"000111131100\",\"000001222200\",\"003100000000\",\"031130011300\",\"011120113100\",\"002200022200\"] },\n  { id: \"cream\", emoji: \"🍦\", label: \"squirty cream\",\n    palette: [null, \"#ffffff\", \"#d7d2e4\", \"#ffd34d\"],\n    rows: [\"000001100000\",\"000011110000\",\"000111112000\",\"001111111200\",\"000111112000\",\"001111111200\",\"011111111120\",\"001111111200\",\"000111112000\",\"000011120000\",\"000001120000\",\"000001200000\"] },\n  { id: \"honey\", emoji: \"🍯\", label: \"honey jar\",\n    palette: [null, \"#ffd34d\", \"#b5651d\", \"#8a4a12\", \"#ffe9a8\"],\n    rows: [\"000000000000\",\"000333333000\",\"000333333000\",\"000222222000\",\"002111111200\",\"021411111120\",\"021411111120\",\"021111111120\",\"021111111120\",\"002111111200\",\"000222222000\",\"000000000000\"] },\n  { id: \"sprinkles\", emoji: \"✨\", label: \"sprinkles\",\n    palette: [null, \"#ffd34d\", \"#ff5d73\", \"#6fb3ff\", \"#3ddc97\"],\n    rows: [\"000010000000\",\"000111000200\",\"000010002220\",\"000000000200\",\"003000000000\",\"033300004000\",\"003000044400\",\"000000004000\",\"000002000000\",\"000022200100\",\"000002001110\",\"000000000100\"] },\n  { id: \"cherry\", emoji: \"🍒\", label: \"a cherry on top\",\n    palette: [null, \"#ff5d73\", \"#a3182f\", \"#3ddc97\", \"#ffd9df\"],\n    rows: [\"000000330000\",\"000003300000\",\"000033000000\",\"000330030000\",\"003300003000\",\"011110011110\",\"141110141110\",\"111110111110\",\"021120021120\",\"002200022200\",\"000000000000\",\"000000000000\"] },\n  { id: \"bacon\", emoji: \"🥓\", label: \"bacon\",\n    palette: [null, \"#d1443f\", \"#8f2420\", \"#f0d0b0\"],\n    rows: [\"000000000000\",\"001111330000\",\"011332211000\",\"022110011100\",\"000000001220\",\"000000000000\",\"001133000000\",\"011221110000\",\"022000111100\",\"000000022110\",\"000000000220\",\"000000000000\"] },\n];\n\nconst CREW_ORDER = [\n  [\"marriott\", \"Everyone's punchbag · easiest band\"],\n  [\"pitt\", \"Wants it pale · 20–34\"],\n  [\"nash\", \"Precise · 48–56, tuts\"],\n  [\"marco\", \"Invented words · medium syrup\"],\n  [\"james\", \"Everything, then more\"],\n  [\"groves\", \"Charred · 82–95\"],\n];\n\nclass Component extends DCLogic {\n  state = { icons: [], waffles: [], crew: [], faces: {}, iconUrls: {} };\n\n  componentDidMount() {\n    const iconUrls = {};\n    for (const ic of ICONS) iconUrls[ic.id] = this.toUrl(12, 12, ic.palette, ic.rows);\n    this.setState({\n      iconUrls,\n      icons: ICONS.map((ic) => ({\n        id: ic.id, emoji: ic.emoji, label: ic.label,\n        url: this.toUrl(12, 12, ic.palette, ic.rows),\n        swatches: ic.palette.filter(Boolean),\n      })),\n      waffles: WAFFLE_FRAMES.map((f) => ({\n        label: f.label,\n        url: this.toUrl(12, 12, f.palette, WAFFLE_ROWS),\n        palette: f.palette.filter(Boolean),\n        hexes: f.palette.filter(Boolean).join(\" \"),\n      })),\n    });\n\n    import(window.__resources && window.__resources.crewSprites ? window.__resources.crewSprites : \"./crew-sprites.js\").then(({ CREW_SPRITES }) => {\n      const crew = CREW_ORDER.map(([id, note]) => {\n        const sp = CREW_SPRITES[id];\n        if (!sp) return null;\n        const rows = [];\n        for (let y = 0; y < sp.h; y++) rows.push(sp.pixels.slice(y * sp.w, (y + 1) * sp.w));\n        return {\n          id, note,\n          name: id.toUpperCase(),\n          url: this.toUrl(sp.w, sp.h, sp.palette, rows),\n          palette: sp.palette,\n        };\n      }).filter(Boolean);\n      const faces = {};\n      for (const c of crew) faces[c.id] = c.url;\n      this.setState({ crew, faces });\n    }).catch(() => {});\n  }\n\n  toUrl(w, h, palette, rows) {\n    const c = document.createElement(\"canvas\");\n    c.width = w; c.height = h;\n    const ctx = c.getContext(\"2d\");\n    const img = ctx.createImageData(w, h);\n    const px = rows.join(\"\");\n    for (let i = 0; i < w * h; i++) {\n      const hex = palette[parseInt(px[i], 16)];\n      const o = i * 4;\n      if (!hex) { img.data[o + 3] = 0; continue; }\n      img.data[o] = parseInt(hex.slice(1, 3), 16);\n      img.data[o + 1] = parseInt(hex.slice(3, 5), 16);\n      img.data[o + 2] = parseInt(hex.slice(5, 7), 16);\n      img.data[o + 3] = 255;\n    }\n    ctx.putImageData(img, 0, 0);\n    return c.toDataURL(\"image/png\");\n  }\n\n  renderVals() {\n    const f = this.state.faces;\n    const u = this.state.iconUrls;\n    const v = Math.max(0, Math.min(100, this.props.meterValue ?? 52));\n    return {\n      berry: u.blueberry, choc: u.chocolate, jar: u.honey,\n      straw: u.strawberry, nuts: u.nuts, cherry: u.cherry, bacon: u.bacon,\n      showNotes: this.props.showNotes ?? true,\n      markerTop: `${100 - v}%`,\n      icons: this.state.icons,\n      waffles: this.state.waffles,\n      crew: this.state.crew,\n      nash: f.nash, pitt: f.pitt, james: f.james, marriott: f.marriott,\n      marco: f.marco, groves: f.groves,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
