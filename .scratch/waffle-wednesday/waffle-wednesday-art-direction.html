document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ced-motion: reduce) {\n    .ww-motion { animation: none !important; }\n    .ww-motion-hide { display: none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; width: max-content; min-width: 100%; background: #17122b; padding: 64px 72px 120px; box-sizing: border-box; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #f3efff;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-bottom: 64px; max-width: 900px;\">\n    <div style=\"font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: 1px; color: #ff5d73;\">ARCADE ATTIC<\u002Fdiv>\n    <h1 style=\"font-family: 'Press Start 2P', monospace; font-size: 30px; line-height: 1.5; margin: 0; color: #ffd34d;\">Waffle Wednesday<\u002Fh1>\n    <p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.7; color: #b3a9d9; text-wrap: pretty; max-width: 68ch;\">Visual art-direction pass. Six artboards plus a motion study, at the real panel size (360×620 mobile-first), built on the existing <span style=\"color:#f3efff;\">assets/styles.css<\u002Fspan> tokens and <span style=\"color:#f3efff;\">game.css<\u002Fspan> geometry. Nothing here needs a build step: every surface is a flat fill, a chunky near-black border, a hard 3px offset shadow, or an emoji. Motion is <span style=\"color:#ffd34d;\">implied<\u002Fspan> everywhere — each animated treatment is drawn alongside its reduced-motion twin.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;\">\n      <span style=\"font-size: 11px; letter-spacing: 1px; padding: 5px 9px; border: 2px solid #4a3f7a; border-radius: 6px; background: #211a3d; color: #b3a9d9;\">#17122b attic<\u002Fspan>\n      <span style=\"font-size: 11px; letter-spacing: 1px; padding: 5px 9px; border: 2px solid #4a3f7a; border-radius: 6px; background: #211a3d; color: #b3a9d9;\">#211a3d panel<\u002Fspan>\n      <span style=\"font-size: 11px; letter-spacing: 1px; padding: 5px 9px; border: 2px solid #4a3 ospace; font-size: 12px; color: #f3efff;\">Waffle Wednesday<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"position: relative; width: 360px; height: 620px; box-sizing: border-box; border: 2px solid #4a3f7a; border-radius: 8px; background: linear-gradient(180deg, #2a1c34 0%, #3a2438 55%, #4a2f2a 100%); box-shadow: 3px 3px 0 #0f0c1e; overflow: hidden; font-family: system-ui, sans-serif;\">\n\n          <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 28px; box-sizing: border-box;\">\n            <div style=\"font-size: 44px; line-height: 1;\">🧧<\u002Fdiv>\n            <h2 style=\"font-family: 'Press Start 2P', monospace; font-size: 20px; line-height: 1.6; color: #ffd34d; margin: 0; text-shadow: 3px 3px 0 #0f0c1e;\">Waffle<br>Wednesday<\u002Fh2>\n            <p style=\"margin: 0; color: #b3a9d9; font-size: 13px; line-height: 1.6; max-width: 30ch; text-wrap: pretty;\">One shift. Twenty customers. Toast it right, top it faster. Three walkouts and it’s a bad Wednesday.<\u002Fp>\n            <button type=\"button\" style=\"font-family: 'Press Start 2P', monospace; font-size: 14px; line-height: 1.5; padding: 16px 20px; color: #17122b; background: #ffd34d; border: 3px solid #0f0c1e; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; cursor: pointer;\">🧧 Start shift<\u002Fbutton>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px;\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #b3a9d9; letter-spacing: 1px; text-transform: uppercase;\">Best Wednesday: 3,240 · Chef’s kiss<\u002Fdiv>\n              <button type=\"button\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #b3a9d9; background: none; border: 1px solid #4a3f7a; border-radius: 6px; padding: 5px 9px; cursor: pointer; opacity: 0.6;\">reset best<\u002Fbutton>\n ercase;\">Mid-shift — full panel<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 40px; align-items: flex-start;\">\n        <div style=\"width: 360px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n            <span style=\"font-size: 12px; color: #b3a9d9;\">← The Attic<\u002Fspan>\n            <span style=\"font-family: 'Press Start 2P', monospace; font-size: 12px; color: #f3efff;\">Waffle Wednesday<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; width: 360px; height: 620px; box-sizing: border-box; border: 2px solid #4a3f7a; border-radius: 8px; background: linear-gradient(180deg, #2a1c34 0%, #3a2438 55%, #4a2f2a 100%); box-shadow: 3px 3px 0 #0f0c1e; overflow: hidden; display: flex; flex-direction: column; font-family: system-ui, sans-serif;\">\n\n            <!-- HUD -->\n            <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(4,2,14,0.55); font-family: 'Press Start 2P', monospace; font-size: 10px; color: #f3efff; border-bottom: 2px solid rgba(74,63,122,0.6); flex: 0 0 auto;\">\n              <span>Customers 7/20<\u002Fspan>\n              <span style=\"color: #ffd34d;\">1,180<\u002Fspan>\n              <span style=\"display: flex; gap: 4px; align-items: center;\">\n                <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #ff5d73; box-shadow: 0 0 6px #ff5d73;\"><\u002Fspan>\n                <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #f3efff; opacity: 0.22;\"><\u002Fspan>\n                <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #f3efff; opacity: 0.22;\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n\n            <!-- Counter -->\n            <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px; flex: 0 0 auto;\">\n argin-bottom: 16px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 4px, transparent 4px 10px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 4px, transparent 4px 10px), hsl(38 57% 60%);\"><\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"position: relative; width: 98px; height: 98px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 3px 3px 0 #0f0c1e; display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n                  <div style=\"position: absolute; left: 8px; right: 8px; bottom: 14px; height: 26px; border-radius: 50%; background: rgba(181,101,29,0.75);\"><\u002Fdiv>\n                  <div style=\"position: relative; width: 64px; height: 64px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 4px, transparent 4px 10px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 4px, transparent 4px 10px), hsl(38 57% 60%); box-shadow: 0 3px 0 rgba(0,0,0,0.25);\">\n                    <div style=\"position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(160deg, rgba(255,211,77,0.42), rgba(181,101,29,0.3));\"><\u002Fdiv>\n                    <img src=\"{{ berry }}\" alt=\"blueberries\" style=\"position: absolute; left: 12%; top: 22%; width: 20px; height: 20px; image-rendering: pixelated; transform: rotate(-8deg);\">\n                    <img src=\"{{ berry }}\" alt=\"\" style=\"position: absolute; left: 48%; top: 46%; width: 20px; height: 20px; image-rendering: pixelated; transform: rotate(11deg);\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display: flex; flex-direction: column; gap: 10px; align-items: center; padding-bottom: 4px;\">\n                  <div style=\"display: flex; flex-direction: column; align-items: center; gap: 3px;\">\n                    <span style=\"font-size: 19px; line-height: 1;\">🍯<\u002Fspan>\n                    <div style=\"width: 30px; height: 7px; border-radius: 4px; background: rgba(0,0,0,0.3); border: 1px solid #0f0c1e; overflow: hidden;\">\n                      <div style=\"height: 100%; width: 62%; background: #b5651d;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; align-items: center; gap: 3px;\">\n                    <span style=\"font-size: 19px; line-height: 1;\">🍦<\u002Fspan>\n                    <div style=\"width: 30px; height: 7px; border-radius: 4px; background: rgba(0,0,0,0.3); border: 1px solid #0f0c1e; overflow: hidden;\">\n                      <div style=\"height: 100%; width: 24%; background: #f3efff;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;\">\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">🍓<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">🍌<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; background: #2b2350; border: 2px solid #3ddc97; border-radius: 8px; padding: 7px 0; box-shadow: 0 0 0 1px rgba(61,220,151,0.35);\"><img src=\"{{ berry }}\" alt=\"blueberries\" style=\"width: 22px; height: 22px; display: block; image-rendering: pixelated;\"><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">🍫<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">🥕<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">✨<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">🍒<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #2b2350; border: 2px solid #4a3f7a; border-radius: 8px; padding: 7px 0;\">🥓<\u002Fdiv>\n              <\u002Fdiv>\n\n              <button type=\"button\" style=\"width: 100%; font-family: 'Press Start 2P', monospace; font-size: 15px; line-height: 1.4; letter-spacing: 2px; padding: 14px 0; color: #17122b; background: #ffd34d; border: 3px solid #0f0c1e; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; cursor: pointer;\">SERVE<\u002Fbutton>\n            <\u002Fdiv>\n\n            <!-- Speech bubble overlay -->\n            <div style=\"position: absolute; left: 26px; top: 254px; white-space: nowrap; background: rgba(4,2,14,0.92); border: 2px solid #4a3f7a; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; padding: 8px 12px; font-size: 12px; line-height: 1.3; color: #f3efff;\">\n              Did you even read the ticket?\n              <span style=\"position: absolute; left: 10px; top: -7px; width: 10px; height: 10px; background: rgba(4,2,14,0.92); border-left: 2px solid #4a3f7a; border-top: 2px solid #4a3f7a; transform: rotate(45deg);\"><\u002Fspan>\n              <span style=\"position: absolute; left: 14px; top: -26px; width: 2px; height: 20px; background: repeating-linear-gradient(180deg, #4a3f7a 0 4px, transparent 4px 8px);\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width: 300px; display: flex; flex-direction: column; gap: 22px; padding-top: 34px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">HUD<\u002Fdiv>\n              <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9;\">Press Start 2P at 10px, three-column space-between. Strikes become <span style=\"color:#f3efff;\">round lights<\u002Fspan>, not glyphs: lit = <span style=\"color:#ff5d73;\">#ff5d73<\u002Fspan> with a 6px glow, unlit = ink at 22%. Reads at a glance without colour alone carrying it — the glow adds a second cue.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">COUNTER<\u002Fdiv>\n              <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9;\">Portrait gets the full frame treatment (3px #0f0c1e + hard shadow on a #2b2350 backing) so a 28×28 sprite upscaled to 64px still reads as an object, not a smear. Name set in the display font at 8px — the only display-font use below the HUD.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">TICKET<\u002Fdiv>\n              <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9;\">Cream #f7f0dc paper, −1° rotation, hard shadow. Order line goes <span style=\"color:#f3efff;\">600 weight<\u002Fspan> and the flavour line stays italic — two levels of read on one card. Patience bar lives <em>inside<\u002Fem> the paper so it feels like the customer’s clock, not the game’s.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ff5d73; letter-spacing: 1px;\">QUEUE — CHANGED<\u002Fdiv>\n              <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9;\">Moved from a right-hand vertical stack to a <span style=\"color:#f3efff;\">horizontal strip<\u002Fspan>. The stack collided with the station at 620px tall; the strip buys ~90px back and lets the ticket text run three across at 9px. Opacity steps 0.75 / 0.6 / 0.5 imply depth in the line.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ff5d73; letter-spacing: 1px;\">STATION — CHANGED<\u002Fdiv>\n              <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9;\">Toaster and plate sit <span style=\"color:#f3efff;\">side by side<\u002Fspan> (was stacked), shelf becomes a fixed 4×2 grid of 8 drag chips plus 2 press-and-hold pourers instead of wrap, and SERVE drops to a full-width bar at the bottom for thumb reach. Chips holding a wanted topping carry a <span style=\"color:#3ddc97;\">#3ddc97<\u002Fspan> border.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #6fb3ff; letter-spacing: 1px;\">MOTION<\u002Fdiv>\n              <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9;\">Portrait bob and steam are decoration and vanish under reduced-motion. The speech bubble replaces the old fading <span style=\"color:#f3efff;\">.ww-say<\u002Fspan> toast: it is a persistent object with a tail anchored to the portrait, so it survives with animation off.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ======================= 03 TOASTER SLOT ======================= -->\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n        <div style=\"font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ffd34d; letter-spacing: 1px;\">03 · PRIMARY<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #f3efff; letter-spacing: 2px; text-transform: uppercase;\">Toaster slot close-up<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 44px; align-items: flex-start; padding: 32px; border: 2px solid #4a3f7a; border-radius: 8px; background: linear-gradient(180deg, #2a1c34, #4a2f2a); box-shadow: 3px 3px 0 #0f0c1e;\">\n\n        <div style=\"position: relative; width: 210px; height: 400px; box-sizing: border-box; border: 4px solid #0c0a18; border-radius: 14px; background: linear-gradient(100deg, #7b7b86 0%, #6b6b76 45%, #57575f 100%); box-shadow: inset 0 -22px 0 rgba(0,0,0,0.25), 4px 4px 0 #0f0c1e; display: flex; align-items: flex-end; justify-content: flex-start;\">\n          <div style=\"position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.75);\">tap to eject<\u002Fdiv>\n          <div style=\"position: absolute; left: 18px; right: 52px; top: 44px; height: 14px; border-radius: 7px; background: #16151d; box-shadow: inset 0 3px 0 rgba(0,0,0,0.7);\"><\u002Fdiv>\n\n          <div class=\"ww-motion-hide\" style=\"position: absolute; top: 58px; left: 38%; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); animation: ww-steam 1.4s ease-in-out infinite; : flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">DONENESS RAMP<\u002Fdiv>\n            <div style=\"display: flex; gap: 14px; align-items: flex-start;\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px; align-items: center;\">\n                <div style=\"width: 92px; height: 92px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 6px, transparent 6px 15px), repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0 6px, transparent 6px 15px), hsl(41 55% 74.5%); box-shadow: 3px 3px 0 #0f0c1e;\"><\u002Fdiv>\n                <div style=\"font-size: 10px; color: #f3efff;\">pale<\u002Fdiv>\n                <div style=\"font-size: 9px; color: #b3a9d9;\">v 27<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 8px; align-items: center;\">\n                <div style=\"width: 92px; height: 92px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 6px, transparent 6px 15px), repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0 6px, transparent 6px 15px), hsl(41 55% 67.5%); box-shadow: 3px 3px 0 #0f0c1e;\"><\u002Fdiv>\n                <div style=\"font-size: 10px; color: #f3efff;\">just golden<\u002Fdiv>\n                <div style=\"font-size: 9px; color: #b3a9d9;\">v 41<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 8px; align-items: center;\">\n                <div style=\"width: 92px; height: 92px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 6px, transparent 6px 15px), repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0 6px, transparent 6px 15px), hsl(38 57% 60%); box-shadow: 3px 3px 0 #0f0c1e; outline: 3px solid #ffd34d; outline-offset: 3px;\"><\u002Fdiv>\n                <div style=\"font-size: 10px; color: #ff rd <span style=\"color:#f3efff;\">#33231a<\u002Fspan> and deepen the pocket shading from 0.18 to 0.35 alpha — the burnt frame above uses those values.<\u002Fdiv>\n            <div><span style=\"color:#6fb3ff;\">▪<\u002Fspan> Body is a 100° three-stop grey (#7b7b86 → #57575f) rather than flat #6b6b76: it gives the metal a light source without going glossy. Slot mouth is a 14px #16151d bar with an inset top highlight.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 20px; align-items: flex-start; padding: 18px; border: 2px solid #4a3f7a; border-radius: 8px; background: rgba(4,2,14,0.35);\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 8px; color: #6fb3ff; letter-spacing: 1px;\">MOTION ON<\u002Fdiv>\n              <div style=\"position: relative; height: 74px; border-radius: 6px; background: rgba(0,0,0,0.25);\">\n                <div class=\"ww-motion-hide\" style=\"position: absolute; top: 34px; left: 34%; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.5); animation: ww-steam 1.4s ease-in-out infinite;\"><\u002Fdiv>\n                <div class=\"ww-motion-hide\" style=\"position: absolute; top: 34px; left: 50%; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: ww-steam 1.4s ease-in-out 0.5s infinite;\"><\u002Fdiv>\n                <div class=\"ww-motion-hide\" style=\"position: absolute; top: 34px; left: 66%; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.32); animation: ww-steam 1.4s ease-in-out 0.95s infinite;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 10px; line-height: 1.6; color: #b3a9d9;\">Three wisps rising 26px on a 1.4s stagger.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 8px; color: #3ddc97; letter-spacing: 1px;\">REDUCED MOTION<\u002Fdiv>\n              <div style=\"position: relative; height: 74px; border-radius: 6px; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; gap: 7px;\">\n                <span style=\"width: 4px; height: 22px; border-radius: 2px; background: rgba(255,255,255,0.18);\"><\u002Fspan>\n                <span style=\"width: 4px; height: 32px; border-radius: 2px; background: rgba(255,255,255,0.26);\"><\u002Fspan>\n                <span style=\"width: 4px; height: 22px; border-radius: 2px; background: rgba(255,255,255,0.18);\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size: 10px; line-height: 1.6; color: #b3a9d9;\">Static wisp marks. Cooking is still legible from the meter alone — steam never carries state.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ======================= 03b TRAVEL ANIMATION ======================= -->\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n        <div style=\"font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ffd34d; letter-spacing: 1px;\">03b<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #f3efff; letter-spacing: 2px; text-transform: uppercase;\">Waffle travel — stack, toast, eject, plate<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 40px; align-items: flex-start; padding: 30px; border: 2px solid #4a3f7a; border-radius: 8px; background: linear-gradient(180deg, #2a1c34, #4a2f2a); box-shadow: 3px 3px 0 #0f0c1e;\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #3ddc97; letter-spacing: 1px;\">LIVE LOOP · 5.2s<\u00 %, #c9862f 68%, #f4e4c4 100%);\">\n                <div style=\"position: absolute; left: -2px; right: -2px; top: 40%; height: 9%; background: rgba(255,255,255,0.26); border-top: 2px solid #ffd34d; border-bottom: 2px solid #ffd34d;\"><\u002Fdiv>\n                <div class=\"ww-motion\" style=\"position: absolute; left: -5px; right: -5px; top: 100%; height: 3px; background: #f3efff; box-shadow: 0 0 6px #f3efff; animation: ww-climb 5.2s ease-in-out infinite;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"ww-motion-hide\" style=\"position: absolute; left: 130px; bottom: 146px; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.55); animation: ww-puff 5.2s linear infinite, ww-steam 1.4s ease-in-out infinite;\"><\u002Fdiv>\n            <div class=\"ww-motion-hide\" style=\"position: absolute; left: 144px; bottom: 146px; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.42); animation: ww-puff 5.2s linear infinite, ww-steam 1.4s ease-in-out 0.5s infinite;\"><\u002Fdiv>\n\n            <div style=\"position: absolute; left: 306px; bottom: 16px; width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 3px 3px 0 #0f0c1e;\"><\u002Fdiv>\n\n            <div class=\"ww-motion\" style=\"position: absolute; left: 122px; bottom: 46px; width: 38px; height: 38px; border-radius: 6px; background-color: #f0dfbe; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0 3px, transparent 3px 8px), repeating-linear-gradient(90deg, rgba(0,0,0,0.2) 0 3px, transparent 3px 8px); box-shadow: 0 3px 0 rgba(0,0,0,0.3); animation: ww-cycle 5.2s cubic-bezier(0.4, 0, 0.35, 1) infinite;\"><\u002Fdiv>\n\n            <div style=\"position: absolute; left: 44px; top: 150px; width: 66px; border-top: 2px dashed rgba(61,220,151,0.5); transform: rotate(-24deg);\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 182px; top: 66px; width: 106px; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,211,77,0.55) 0 6px, transparent 6px 12px);\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 196px; top: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; color: rgba(255,211,77,0.8);\">arc, 9° tilt<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; line-height: 1.65; color: #b3a9d9; width: 420px;\">Three stages, one element, one keyframe track. A tap on the stack spawns a waffle (green pulse, stock ticks down) that carries into the slot; colour and position then animate together through toasting so the waffle you watched cook is visibly the same object that lands on the plate. Ejection reads as a <span style=\"color:#f3efff;\">pop<\u002Fspan> before the arc, and the landing carries an overshoot bounce.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width: 500px; display: flex; flex-direction: column; gap: 22px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: 'Press Start 2P', monospace; font-size: 9px; color: #ffd34d; letter-spacing: 1px;\">FRAME SPEC · REDUCED-MOTION STATES<\u002Fdiv>\n            <div style=\"display: flex; gap: 10px;\">\n              <div style=\"display: flex; flex-direction: column; gap: 7px; align-items: center; width: 88px;\">\n                <div style=\"position: relative; width: 88px; height: 96px; border: 2px solid #4a3f7a; border-radius: 6px; background: rgba(4,2,14,0.3);\">\n                  <div style=\"position: absolute; left: 8px; bottom: 8px; width: 18px; height: 10px; border-radius: 3px; background: #ecdcb4; border: 1px solid #0c0a18;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 44px; bottom: 30px; width: 30px; height: 54px; border: 2px solid #0c0a18; border-radius: 5px; background: #6b6b76;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 20px; bottom: 20px; width: 14px; height: 14px; border-radius: 3px; background: #f0dfbe; transform: rotate(-8deg);\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #f3efff; text-align: center;\">0–24%<br>spawn, carry in<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 7px; align-items: center; width: 88px;\">\n                <div style=\"position: relative; width: 88px; height: 96px; border: 2px solid #4a3f7a; border-radius: 6px; background: rgba(4,2,14,0.3);\">\n                  <div style=\"position: absolute; left: 10px; bottom: 8px; width: 30px; height: 54px; border: 2px solid #0c0a18; border-radius: 5px; background: #6b6b76;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 15px; bottom: 14px; width: 20px; height: 20px; border-radius: 4px; background: #e9cb95;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 46px; bottom: 30px; width: 4px; height: 22px; border-radius: 2px; background: rgba(255,255,255,0.22);\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #f3efff; text-align: center;\">24–54%<br>toast, recolour<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 7px; align-items: center; width: 88px;\">\n                <div style=\"position: relative; width: 88px; height: 96px; border: 2px solid #4a3f7a; border-radius: 6px; background: rgba(4,2,14,0.3);\">\n                  <div style=\"position: absolute; left: 10px; bottom: 8px; width: 30px; height: 54px; border: 2px solid #0c0a18; border-radius: 5px; background: #6b6b76;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 15px; bottom: 58px; width: 20px; height: 20px; border-radius: 4px; background: #d9a55c;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #f3efff; text-align: center;\">60%<br>eject pop<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 7px; align-items: center; width: 88px;\">\n                <div style=\"position: relative; width: 88px; height: 96px; border: 2px solid #4a3f7a; border-radius: 6px; background: rgba(4,2,14,0.3);\">\n                  <div style=\"position: absolute; left: 10px; bottom: 8px; width: 30px; height: 54px; border: 2px solid #0c0a18; border-radius: 5px; background: #6b6b76;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 42px; bottom: 62px; width: 20px; height: 20px; border-radius: 4px; background: #d9a55c; transform: rotate(9deg);\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 34px; bottom: 40px; width: 44px; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,211,77,0.5) 0 5px, transparent 5px 10px);\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #f3efff; text-align: center;\">72%<br>arc across<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 7px; align-items: center; width: 88px;\">\n                <div style=\"position: relative; width: 88px; height: 96px; border: 2px solid #3ddc97; border-radius: 6px; background: rgba(4,2,14,0.3);\">\n                  <div style=\"position: absolute; left: 10px; bottom: 8px; width: 30px; height: 54px; border: 2px solid #0c0a18; border-radius: 5px; background: #6b6b76;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 44px; bottom: 8px; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #b3a9d9);\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 53px; bottom: 17px; width: 20px; height: 20px; border-radius: 4px; background: #d9a55c;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size: 9px; color: #3ddc97; text-align: center;\">93–100%<br>plated, toppable<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 9px; font-size: 11px; line-height: 1.65; color: #b3a9d9;\">\n            <div><span style=\"color:#ffd34d;\">▪<\u002Fspan> Timing: spawn + carry-in 0.9s (tap on stack) · toast dwell (variable, driven by the meter) · eject 0.3s · arc 0.6s · land 0.25s. Only the dwell is gameplay; the other moves are fixed and never gate input.<\u002Fdiv>\n            <div><span style=\"color:#3ddc97;\">▪<\u002Fspan> <span style=\"color:#f3efff;\">Reduced motion:<\u002Fspan> the waffle simply appears in the slot (no carry from the stack), recolours in place, then appears on the plate — the five frames above <em>are<\u002Fem> the reduced-motion states, so nothing needs a second design pass. Toppings become droppable the instant the plate state is set, never on animation end.<\u002Fdiv>\n            <div><span style=\"color:#6fb3ff;\">▪<\u002Fspan> Implementation note: keep the travelling waffle as the <em>same<\u002Fem> DOM node the whole time, spawned fresh from the stack pool and moved between slot and plate containers only after each animation resolves, so a mid-flight burn or walkout can cancel cleanly. Stock count only decrements once the carry-in finishes.<\u002Fdiv>\n            <div><span style=\"color:#ff5d73;\">▪<\u002Fspan> Steam fades in at 26% and out by 62% — it belongs to the toasting phase only, so it never trails the waffle across the counter.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ======================= 04 PLATING ======================= -->\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n        <div style=\"font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff5d73; letter-spacing: 1px;\">04<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #f3efff; letter-spacing: 2px; text-transform: uppercase;\">Plating study<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 30px; align-items: flex-start; padding: 30px; border: 2px solid #4a3f7a; border-radius: 8px; background: linear-gradient(180deg, #3a2438, #4a2f2a); box-shadow: 3px 3px 0 #0f0c1e;\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; width: 150px;\">\n          <div style=\"width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 3px 3px 0 #0f0c1e; opacity: 0.4; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"width: 86px; height: 86px; border-radius: 8px; border: 2px dashed rgba(23,18,43,0.35);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; text-align: center; line-height: 1.6;\"><span style=\"color:#f3efff;\">empty<\u002Fspan><br>opacity 0.4, dashed ghost<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; width: 150px;\">\n          <div style=\"width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 3px 3px 0 #0f0c1e; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"width: 86px; height: 86px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 5px, transparent 5px 13px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 5px, transparent 5px 13px), hsl(38 57% 60%); box-shadow: 0 4px 0 rgba(0,0,0,0.22);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; text-align: center; line-height: 1.6;\"><span style=\"color:#3ddc97;\">waffle ready<\u002Fspan><br>full opacity + 4px drop<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; width: 168px;\">\n          <div style=\"width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 3px 3px 0 #0f0c1e; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"position: relative; width: 86px; height: 86px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 5px, transparent 5px 13px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 5px, transparent 5px 13px), hsl(38 57% 60%); box-shadow: 0 4px 0 rgba(0,0,0,0.22);\">\n              <div style=\"position: absolute; inset: 0; border-radius: 8px; background: radial-gradient(ellipse at 62% 30%, rgba(255,255,255,0.5) 0 18%, transparent 22%), linear-gradient(155deg, rgba(255,211,77,0.34), rgba(181,101,29,0.24));\"><\u002Fdiv>\n              <span style=\"position: absolute; left: 26%; top: 24%; transform: translate(-50%,-50%) rotate(-14deg); font-size: 19px; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">🍓<\u002Fspan>\n              <span style=\"position: absolute; left: 47%; top: 17%; transform: translate(-50%,-50%) rotate(7deg); font-size: 15px; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">🍒<\u002Fspan>\n              <img src=\"{{ berry }}\" alt=\"\" style=\"position: absolute; left: 70%; top: 27%; width: 19px; height: 19px; transform: translate(-50%,-50%) rotate(12deg); image-rendering: pixelated; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">\n              <img src=\"{{ choc }}\" alt=\"\" style=\"position: absolute; left: 33%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%) rotate(-6deg); image-rendering: pixelated; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">\n              <span style=\"position: absolute; left: 58%; top: 52%; transform: translate(-50%,-50%) rotate(16deg); font-size: 17px; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">🥕<\u002Fspan>\n              <span style=\"position: absolute; left: 78%; top: 62%; transform: translate(-50%,-50%) rotate(-9deg); font-size: 14px; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">✨<\u002Fspan>\n              <span style=\"position: absolute; left: 26%; top: 74%; transform: translate(-50%,-50%) rotate(9deg); font-size: 16px; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">🍌<\u002Fspan>\n              <span style=\"position: absolute; left: 52%; top: 78%; transform: translate(-50%,-50%) rotate(-17deg); font-size: 15px; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">✨<\u002Fspan>\n              <img src=\"{{ berry }}\" alt=\"\" style=\"position: absolute; left: 15%; top: 44%; width: 15px; height: 15px; transform: translate(-50%,-50%) rotate(-20deg); image-rendering: pixelated; filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.45));\">\n              <div style=\"position: absolute; left: 50%; top: 9%; transform: translate(-50%,0) rotate(-3deg); width: 58%; height: 13px; border-radius: 9px; background: radial-gradient(circle 8px at 18% 45%, #fff 96%, transparent 100%), radial-gradient(circle 8px at 50% 40%, #fff 96%, transparent 100%), radial-gradient(circle 7px at 82% 52%, #fff 96%, transparent 100%), linear-gradient(180deg, #fff, #ddd8ea); filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.32));\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 7px;\">\n            <span style=\"font-size: 22px;\">🍯<\u002Fspan>\n            <div style=\"width: 46px; height: 9px; border-radius: 5px; background: rgba(0,0,0,0.3); border: 1px solid #0f0c1e; overflow: hidden;\">\n              <div style=\"height: 100%; width: 50%; background: #b5651d;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size: 10px; color: #b3a9d9;\">50%<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; text-align: center; line-height: 1.6;\"><span style=\"color:#f3efff;\">plated · 9 toppings<\u002Fspan><br>jittered scatter: ±20° rotation, 14–22px sizes, cream ribbon on top<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; width: 170px;\">\n          <div style=\"display: flex; gap: 7px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 5px; align-items: center;\">\n              <div style=\"position: relative; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 2px 2px 0 #0f0c1e; overflow: hidden; display: flex; align-items: center; justify-content: center;\">\n                <div style=\"position: absolute; left: 7px; right: 7px; bottom: 8px; height: 8px; border-radius: 50%; background: rgba(181,101,29,0.7);\"><\u002Fdiv>\n                <div style=\"position: relative; width: 32px; height: 32px; border-radius: 5px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 8px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 8px), hsl(38 57% 60%);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 9px; color: #b3a9d9;\">25%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 5px; align-items: center;\">\n              <div style=\"position: relative; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 2px 2px 0 #0f0c1e; overflow: hidden; display: flex; align-items: center; justify-content: center;\">\n                <div style=\"position: absolute; left: 3px; right: 3px; bottom: 5px; height: 15px; border-radius: 50%; background: rgba(181,101,29,0.8);\"><\u002Fdiv>\n                <div style=\"position: relative; width: 32px; height: 32px; border-radius: 5px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 8px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 8px), hsl(38 57% 60%);\">\n                  <div style=\"position: absolute; inset: 0; border-radius: 5px; background: linear-gradient(0deg, rgba(181,101,29,0.6) 0 30%, transparent 30%);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 9px; color: #b3a9d9;\">50%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 5px; align-items: center;\">\n              <div style=\"position: relative; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 2px 2px 0 #0f0c1e; overflow: hidden; display: flex; align-items: center; justify-content: center;\">\n                <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 27px; background: rgba(181,101,29,0.9);\"><\u002Fdiv>\n                <div style=\"position: relative; width: 32px; height: 32px; border-radius: 5px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 8px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 8px), hsl(38 57% 60%);\">\n                  <div style=\"position: absolute; inset: 0; border-radius: 5px; background: linear-gradient(0deg, rgba(181,101,29,0.75) 0 68%, transparent 68%);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 9px; color: #ffd34d;\">95%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; text-align: center; line-height: 1.6;\"><span style=\"color:#f3efff;\">syrup pool<\u002Fspan><br>the puddle grows from an 8px ellipse to a flooded rim — level is legible on the plate itself, gauge is confirmation only<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 7px; padding-top: 4px;\">\n            <span style=\"font-size: 20px;\">🍦<\u002Fspan>\n            <div style=\"width: 46px; height: 9px; border-radius: 5px; background: rgba(0,0,0,0.3); border: 1px solid #0f0c1e; overflow: hidden;\">\n              <div style=\"height: 100%; width: 34%; background: #f3efff;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size: 10px; color: #b3a9d9;\">34%<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; text-align: center; line-height: 1.6;\"><span style=\"color:#3ddc97;\">cream is poured, not dragged<\u002Fspan><br>same press-and-hold gauge as honey, in ink-white; it lays a ribbon across the waffle instead of pooling<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ww-motion\" style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; width: 168px; animation: ww-shudder 0.3s ease;\">\n          <div style=\"width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, #d7d2e4 70%, #b3a9d9); box-shadow: 3px 3px 0 #0f0c1e, 0 0 0 4px #ff5d73; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"position: relative; width: 86px; height: 86px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 5px, transparent 5px 13px), repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 5px, transparent 5px 13px), #a8641f; box-shadow: 0 4px 0 rgba(0,0,0,0.22); overflow: hidden;\">\n              <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(181,101,29,0.15), rgba(181,101,29,0.85));\"><\u002Fdiv>\n              <div style=\"position: absolute; left: -6px; right: -6px; bottom: -8px; height: 16px; border-radius: 50%; background: #8a4a12;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 7px;\">\n            <span style=\"font-size: 22px;\">🍯<\u002Fspan>\n            <div style=\"width: 46px; height: 9px; border-radius: 5px; background: rgba(0,0,0,0.3); border: 1px solid #ff5d73; overflow: hidden;\">\n              <div style=\"height: 100%; width: 100%; background: #ff5d73;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size: 10px; color: #ff5d73;\">100%<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; text-align: center; line-height: 1.6;\"><span style=\"color:#ff5d73;\">overflow<\u002Fspan><br>syrup floods the plate, gauge flips pink, 4px pink ring + shudder<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width: 250px; display: flex; flex-direction: column; gap: 9px; font-size: 11px; line-height: 1.65; color: #b3a9d9;\">\n          <div><span style=\"color:#ffd34d;\">▪<\u002Fspan> Toppings get a 1px hard drop-shadow so emoji sit <em>on<\u002Fem> the waffle rather than floating over it. No scaling, no rotation — the grid does the work.<\u002Fdiv>\n          <div><span style=\"color:#ffd34d;\">▪<\u002Fspan> Syrup is drawn as a fill <em>inside<\u002Fem> the waffle plus a pooling ellipse at its base, so level is visible on the food itself, not only in the gauge.<\u002Fdiv>\n          <div><span style=\"color:#ff5d73;\">▪<\u002Fspan> Overflow is triple-cued: colour (pink), shape (pool + ring) and text (100%). Reduced-motion drops only the shudder.<\u002Fdiv>\n          <div><span style=\"color:#6fb3ff;\">▪<\u002Fspan> Empty state uses a dashed ghost square rather than a bare plate — it tells you where the waffle goes instead of just looking unfinished.<\u002Fdiv>\n          <div><span style=\"color:#3ddc97;\">▪<\u002Fspan> <span style=\"color:#f3efff;\">Shelf split:<\u002Fspan> 8 drag chips + 2 press-and-hold pourers (honey, cream). Honey leaves the chip shelf entirely — it was both a topping and the syrup, which read as a duplicate.<\u002Fdiv>\n          <div><span style=\"color:#ffd34d;\">▪<\u002Fspan> Scatter rules: place on a jittered 3×3 lattice, then offset each item up to 6% and rotate ±20°. Vary size 14–22px by topping weight (bacon and chocolate largest, sprinkles smallest) and let items overlap by up to a third — a rigid grid reads as a spreadsheet, not food.<\u002Fdiv>\n          <div><span style=\"color:#ff5d73;\">▪<\u002Fspan> The blueberries emoji (U+1FAD3) is missing from many system fonts and renders as a tofu box — it uses the 12×12 sprite from artboard 06 everywhere instead. Same fallback rule as any other missing glyph.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ======================= 05 REPORT CARD ======================= -->\n    <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n        <div style=\"font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff5d73; letter-spacing: 1px;\">05<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #f3efff; letter-spacing: 2px; text-transform: uppercase;\">Report card — four ratings<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 24px; align-items: flex-start;\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"position: relative; width: 300px; height: 470px; box-sizing: border-box; border: 2px solid #4a3f7a; border-radius: 8px; background: linear-gradient(180deg, #2a1c34 0%, #3a2438 55%, #4a2f2a 100%); box-shadow: 3px 3px 0 #0f0c1e; overflow: hidden; font-family: system-ui, sans-serif;\">\n            <div class=\"ww-motion-hide\" style=\"position: absolute; inset: 0;\">\n              <span style=\"position: absolute; top: -12px; left: 12%; width: 8px; height: 12px; background: #ffd34d; animation: ww-fall 1.3s ease-in 0.05s infinite;\"><\u002Fspan>\n              <span style=\"position: absolute; top: -12px; left: 27%; width: 8px; height: 12px; background: #ff5d73; animation: ww-fall 1.6s ease-in 0.2s infinite;\"><\u002Fspan>\n              <span style=\"position: absolute; top: -12px; left: 41%; width: 8px; height: 12px; background: #3ddc97; animation: ww-fall 1.15s ease-in 0.12s infinite;\"><\u002Fspan>\n              <span style=\"position: absolute; top: -12px; left: 56%; width: 8px; height: 12px; background: #6fb3ff; animation: ww-fall 1.5s ease-in 0.28s infinite;\"><\u002Fspan>\n              <span style=\"position: absolute; top: -12px; left: 71%; width: 8px; height: 12px; background: #ffd34d; animation: ww-fall 1.25s ease-in 0.02s infinite;\"><\u002Fspan>\n              <span style=\"position: absolute; top: -12px; left: 86%; width: 8px; height: 12px; background: #ff5d73; animation: ww-fall 1.7s ease-in 0.34s infinite;\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position: absolute; inset: 0; background: rgba(4,2,14,0.72); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 26px; box-sizing: border-box;\">\n              <div style=\"font-size: 34px; line-height: 1;\">👌<\u002Fdiv>\n              <h2 style=\"font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.6; color: #ffd34d; margin: 0; text-shadow: 3px 3px 0 #0f0c1e;\">Chef’s<br>kiss<\u002Fh2>\n              <div style=\"font-family: 'Press Start 2P', monospace; font-size: 26px; color: #f3efff;\">3,240<\u002Fdiv>\n              <p style=\"margin: 0; font-style: italic; font-size: 13px; line-height: 1.55; color: #b3a9d9; max-width: 30ch; text-wrap: pretty;\">Nash: “I have no notes. Terrifying.”<\u002Fp>\n              <div style=\"display: flex; gap: 10px; width: 100%;\">\n                <div style=\"flex: 1; padding: 9px 4px; border: 2px solid #ffd34d; border-radius: 6px; background: rgba(255,211,77,0.1);\">\n                  <b style=\"display: block; font-family: 'Press Start 2P', monospace; font-size: 15px; color: #ffd34d;\">14<\u002Fb>\n                  <span style=\"font-famil            <div style=\"flex: 1; padding: 9px 4px; border: 2px solid #ff5d73; border-radius: 6px; background: rgba(255,93,115,0.1);\">\n                  <b style=\"display: block; font-family: 'Press Start 2P', monospace; font-size: 15px; color: #ff5d73;\">2<\u002Fb>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #b3a9d9;\">walked<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px; width: 100%; margin-top: 2px;\">\n                <button type=\"button\" style=\"flex: 1; font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.5; padding: 12px 4px; color: #0f0c1e; background: #ffd34d; border: 3px solid #0f0c1e; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; cursor: pointer;\">New shift<\u002Fbutton>\n                <button type=\"button\" style=\"flex: 1; font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.5; padding: 12px 4px; color: #f3efff; background: #2b2350; border: 3px solid #0f0c1e; border-radius: 8px; box-shadow: 3px 3px 0 #0f0c1e; cursor: pointer;\">← Attic<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #b3a9d9; line-height: 1.6;\">When walkouts &gt; 0 the walked block takes the pink border instead — one highlighted stat per card, always the one that decided the rating.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"position: relative; width: 300px; height: 470px; box-sizing: border-box; border: 2px solid #ff5d73; border-radius: 8px; background: linear-gradient(180deg, #2a1c34 0%, #3a2438 55%, #4a2f2a 100%); box-shadow: 3px 3px 0 #0f0c1e; overflow: hidden; font-family: system-ui, sans-serif;\">\n            <div style=\"position: absolute; inset: 0; background: rgba(28,4,14,
